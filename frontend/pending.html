<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>StockSense — Pending Approvals</title><link rel="stylesheet" href="style.css"/></head>
<body><div class="page-wrapper"><nav class="navbar"><div class="nav-inner"><a class="nav-brand" href="index.html"><div class="logo-icon"><i data-lucide="package"></i></div><span>Stock<em>Sense</em></span></a><button class="nav-toggle" id="nav-toggle"><i data-lucide="menu"></i></button><ul class="nav-links" id="nav-links"><li><a href="index.html">Dashboard</a></li><li><a href="products.html">Products</a></li><li><a href="receipt.html">Receipt</a></li><li><a href="delivery.html">Delivery</a></li><li><a href="transfer.html">Transfer</a></li><li><a href="adjustment.html">Adjustment</a></li><li><a href="pending.html">Pending Approvals</a></li><li><a href="history.html">Move History</a></li></ul></div></nav><main class="content"><div class="page-header"><div class="header-icon"><i data-lucide="clipboard-check"></i></div><div><h1>Pending Approvals</h1><p>Confirm draft receipts and deliveries to apply them to stock, or discard them.</p></div></div><div id="pending-list" class="card"><div class="empty-state"><div class="spinner"></div><p>Loading pending moves…</p></div></div></main><div id="toast"></div></div>
<script type="module">import{api}from'./api.js';import{requireAuth,markActiveNav,initNavToggle,initAuthHeader,renderLucide,showToast,moveTypeBadge,formatDateTime}from'./utils.js';if(!requireAuth())throw Error('Authentication required');markActiveNav();initNavToggle();initAuthHeader();renderLucide();const list=document.getElementById('pending-list');async function load(){try{const moves=await api.getPendingMoves();if(!moves.length){list.innerHTML='<div class="empty-state"><div class="empty-icon"><i data-lucide="check-circle-2"></i></div><h3>No pending approvals</h3><p>Draft receipts and deliveries will appear here.</p></div>';renderLucide();return}list.innerHTML=`<div class="card-title"><i data-lucide="clock"></i><span>${moves.length} pending move${moves.length===1?'':'s'}</span></div>${moves.map(m=>`<div class="low-stock-item" style="margin-bottom:.7rem"><div><div class="low-stock-name">${m.product_name} ${moveTypeBadge(m.move_type)}</div><div class="low-stock-sku">${m.location_name} · ${m.quantity_change>0?'+':''}${m.quantity_change} ${m.unit_of_measure} · ${formatDateTime(m.timestamp)}${m.note?` · ${m.note}`:''}</div></div><div class="flex gap-2"><button class="btn btn-success" data-confirm="${m.id}"><i data-lucide="check"></i> Confirm</button><button class="btn btn-danger" data-discard="${m.id}"><i data-lucide="trash-2"></i> Discard</button></div></div>`).join('')}`;list.querySelectorAll('[data-confirm]').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;try{await api.confirmMove(b.dataset.confirm);showToast('Draft confirmed and applied to stock.','success');await load()}catch(e){showToast(e.message,'error');b.disabled=false}}));list.querySelectorAll('[data-discard]').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('Discard this draft move?'))return;b.disabled=true;try{await api.discardMove(b.dataset.discard);showToast('Draft discarded.','success');await load()}catch(e){showToast(e.message,'error');b.disabled=false}}));renderLucide()}catch(e){list.innerHTML=`<div class="alert alert-error">${e.message}</div>`}}load();</script></body></html>
