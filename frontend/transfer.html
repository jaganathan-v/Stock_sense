<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>StockSense — Internal Transfer</title><link rel="stylesheet" href="style.css"/></head>
<body><div class="page-wrapper"><nav class="navbar"><div class="nav-inner"><a class="nav-brand" href="index.html"><div class="logo-icon"><i data-lucide="package"></i></div><span>Stock<em>Sense</em></span></a><button class="nav-toggle" id="nav-toggle"><i data-lucide="menu"></i></button><ul class="nav-links" id="nav-links"><li><a href="index.html">Dashboard</a></li><li><a href="products.html">Products</a></li><li><a href="receipt.html">Receipt</a></li><li><a href="delivery.html">Delivery</a></li><li><a href="transfer.html">Transfer</a></li><li><a href="adjustment.html">Adjustment</a></li><li><a href="history.html">Move History</a></li></ul></div></nav>
<main class="content"><div class="page-header"><div class="header-icon"><i data-lucide="arrow-left-right"></i></div><div><h1>Internal Transfer</h1><p>Move stock between locations. The source balance is checked before the transfer is recorded.</p></div></div><div class="card" style="max-width:680px"><div id="form-alert" class="alert hidden"></div><form id="transfer-form"><div class="form-grid"><div class="form-group full"><label for="product">Product *</label><select id="product" required><option value="">Loading products…</option></select></div><div class="form-group"><label for="source">Source location *</label><select id="source" required><option value="">Loading locations…</option></select></div><div class="form-group"><label for="destination">Destination location *</label><select id="destination" required><option value="">Loading locations…</option></select></div><div class="form-group full"><label for="quantity">Quantity *</label><input id="quantity" type="number" min="1" step="1" required/><small id="available" class="text-muted"></small></div></div><button class="btn btn-primary mt-3 w-full" id="submit-btn"><i data-lucide="arrow-left-right"></i> Transfer Stock</button></form></div></main><div id="toast"></div></div>
<script type="module">import {api} from './api.js';import{requireAuth,markActiveNav,initNavToggle,initAuthHeader,renderLucide,showToast,showAlert,setLoading}from'./utils.js';if(!requireAuth())throw Error('Authentication required');markActiveNav();initNavToggle();initAuthHeader();renderLucide();const form=document.getElementById('transfer-form'), product=document.getElementById('product'), source=document.getElementById('source'), dest=document.getElementById('destination'), qty=document.getElementById('quantity'), alert=document.getElementById('form-alert'),btn=document.getElementById('submit-btn');let products=[];function available(){const p=products.find(x=>x.id===Number(product.value));return p?.location_stocks?.[source.selectedOptions[0]?.textContent]??0}function refresh(){const p=products.find(x=>x.id===Number(product.value));document.getElementById('available').textContent=p?`Available at source: ${available()} ${p.unit_of_measure}`:''}Promise.all([api.getProducts(),api.getLocations()]).then(([ps,ls])=>{products=ps;product.innerHTML='<option value="">Select product</option>'+ps.map(p=>`<option value="${p.id}">${p.name} (${p.sku})</option>`).join('');const opts='<option value="">Select location</option>'+ls.map(l=>`<option value="${l.id}">${l.name}</option>`).join('');source.innerHTML=opts;dest.innerHTML=opts;refresh()}).catch(e=>showAlert(alert,e.message,'error'));product.addEventListener('change',refresh);source.addEventListener('change',refresh);form.addEventListener('submit',async e=>{e.preventDefault();const p=products.find(x=>x.id===Number(product.value));if(!p||!source.value||!dest.value||!Number.isInteger(Number(qty.value))||Number(qty.value)<1)return showAlert(alert,'Choose a product, two locations, and a positive whole-number quantity.','error');if(source.value===dest.value)return showAlert(alert,'Choose different source and destination locations.','error');setLoading(btn,true);try{const moves=await api.transfer({product_id:Number(product.value),source_location_id:Number(source.value),destination_location_id:Number(dest.value),quantity:Number(qty.value)});showToast(`Transferred ${qty.value} ${p.unit_of_measure} of ${p.name}.`,'success');form.reset();refresh()}catch(e){showAlert(alert,e.message,'error')}finally{setLoading(btn,false)}});</script></body></html>
