<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>StockSense — Stock Adjustment</title><link rel="stylesheet" href="style.css"/></head>
<body><div class="page-wrapper"><nav class="navbar"><div class="nav-inner"><a class="nav-brand" href="index.html"><div class="logo-icon"><i data-lucide="package"></i></div><span>Stock<em>Sense</em></span></a><button class="nav-toggle" id="nav-toggle"><i data-lucide="menu"></i></button><ul class="nav-links" id="nav-links"><li><a href="index.html">Dashboard</a></li><li><a href="products.html">Products</a></li><li><a href="receipt.html">Receipt</a></li><li><a href="delivery.html">Delivery</a></li><li><a href="transfer.html">Transfer</a></li><li><a href="adjustment.html">Adjustment</a></li><li><a href="history.html">Move History</a></li></ul></div></nav>
<main class="content"><div class="page-header"><div class="header-icon"><i data-lucide="sliders"></i></div><div><h1>Stock Adjustment</h1><p>Reconcile the ledger with a physical count. Review the difference before recording it.</p></div></div><div class="card" style="max-width:680px"><div id="form-alert" class="alert hidden"></div><form id="adjustment-form"><div class="form-grid"><div class="form-group full"><label for="product">Product *</label><select id="product" required><option value="">Loading products…</option></select></div><div class="form-group full"><label for="location">Location *</label><select id="location" required><option value="">Loading locations…</option></select></div><div class="form-group full"><label for="counted">Counted quantity *</label><input id="counted" type="number" min="0" step="1" required/><small id="current" class="text-muted"></small></div></div><div id="preview" class="alert alert-warn mt-2 hidden"></div><button class="btn btn-primary mt-3 w-full" id="submit-btn" disabled><i data-lucide="check"></i> Confirm Adjustment</button></form></div></main><div id="toast"></div></div>
<script type="module">import{api}from'./api.js';import{requireAuth,markActiveNav,initNavToggle,initAuthHeader,renderLucide,showToast,showAlert,setLoading}from'./utils.js';if(!requireAuth())throw Error('Authentication required');markActiveNav();initNavToggle();initAuthHeader();renderLucide();const form=document.getElementById('adjustment-form'),product=document.getElementById('product'),location=document.getElementById('location'),counted=document.getElementById('counted'),preview=document.getElementById('preview'),alert=document.getElementById('form-alert'),btn=document.getElementById('submit-btn');let products=[];function update(){const p=products.find(x=>x.id===Number(product.value)),name=location.selectedOptions[0]?.textContent;const current=p?.location_stocks?.[name]??0;document.getElementById('current').textContent=p?`Current ledger stock: ${current} ${p.unit_of_measure}`:'';const value=counted.value,valid=p&&location.value!==''&&value!==''&&Number.isInteger(Number(value))&&Number(value)>=0;btn.disabled=!valid;if(!valid){preview.classList.add('hidden');return}const diff=Number(value)-current;preview.className='alert alert-warn mt-2';preview.textContent=`Current stock: ${current}. Counted stock: ${value}. Adjustment: ${diff>0?'+':''}${diff} ${p.unit_of_measure}.`;preview.classList.remove('hidden')}Promise.all([api.getProducts(),api.getLocations()]).then(([ps,ls])=>{products=ps;product.innerHTML='<option value="">Select product</option>'+ps.map(p=>`<option value="${p.id}">${p.name} (${p.sku})</option>`).join('');location.innerHTML='<option value="">Select location</option>'+ls.map(l=>`<option value="${l.id}">${l.name}</option>`).join('');update()}).catch(e=>showAlert(alert,e.message,'error'));[product,location,counted].forEach(el=>el.addEventListener('change',update));counted.addEventListener('input',update);form.addEventListener('submit',async e=>{e.preventDefault();if(btn.disabled)return;const p=products.find(x=>x.id===Number(product.value)),current=p?.location_stocks?.[location.selectedOptions[0]?.textContent]??0,diff=Number(counted.value)-current;if(!window.confirm(`Current stock is ${current}. Counted quantity is ${counted.value}. Record an adjustment of ${diff>0?'+':''}${diff} ${p.unit_of_measure}?`))return;setLoading(btn,true);try{await api.adjustment({product_id:Number(product.value),location_id:Number(location.value),counted_quantity:Number(counted.value)});showToast(`Stock adjusted by ${diff>0?'+':''}${diff} ${p.unit_of_measure}.`,'success');form.reset();update()}catch(e){showAlert(alert,e.message,'error')}finally{setLoading(btn,false);update()}});</script></body></html>
