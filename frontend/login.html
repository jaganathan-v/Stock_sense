<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockSense — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Lucide Icons via CDN -->
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-icon"><i data-lucide="package"></i></div>
      <h1>Sign in to StockSense</h1>
      <p>Enter your credentials to access the inventory ledger</p>
    </div>

    <div id="auth-alert" class="alert hidden"></div>

    <form id="login-form" novalidate>
      <div class="form-group full mb-2">
        <label for="email">Email Address *</label>
        <div style="position:relative">
          <input type="email" id="email" placeholder="name@company.com" required autocomplete="email" />
        </div>
        <span class="field-error" id="email-err"></span>
      </div>

      <div class="form-group full mb-2">
        <div class="flex items-center justify-between">
          <label for="password">Password *</label>
          <a href="#" id="forgot-link" style="font-size:.82rem;color:var(--accent);text-decoration:none">Forgot password?</a>
        </div>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        <span class="field-error" id="password-err"></span>
      </div>

      <button type="submit" class="btn btn-primary w-full mt-2" id="submit-btn">
        <i data-lucide="log-in"></i>
        <span>Sign In</span>
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Create an account</a>
    </div>
  </div>

  <div id="toast"></div>

<script type="module">
  import { api } from "./api.js";
  import { showAlert, hideAlert, setLoading, showToast, validateRequired, renderLucide } from "./utils.js";

  renderLucide();

  // If already authenticated, redirect to dashboard
  if (localStorage.getItem("stocksense_token")) {
    window.location.href = "index.html";
  }

  const form      = document.getElementById("login-form");
  const emailEl   = document.getElementById("email");
  const passEl    = document.getElementById("password");
  const alertEl   = document.getElementById("auth-alert");
  const submitBtn = document.getElementById("submit-btn");

  document.getElementById("forgot-link").addEventListener("click", (e) => {
    e.preventDefault();
    showToast("Password reset will be available in Phase 3 OTP flow.", "info");
  });

  form.addEventListener("submit", async e => {
    e.preventDefault();
    hideAlert(alertEl);

    const ok1 = validateRequired(emailEl, document.getElementById("email-err"));
    const ok2 = validateRequired(passEl,  document.getElementById("password-err"));
    if (!ok1 || !ok2) return;

    setLoading(submitBtn, true);
    try {
      const res = await api.login({
        email: emailEl.value.trim(),
        password: passEl.value
      });

      localStorage.setItem("stocksense_token", res.token);
      localStorage.setItem("stocksense_email", res.email);

      showToast("Signed in successfully!", "success");
      setTimeout(() => {
        window.location.href = "index.html";
      }, 500);
    } catch (err) {
      showAlert(alertEl, err.message, "error");
    } finally {
      setLoading(submitBtn, false);
      renderLucide();
    }
  });
</script>
</body>
</html>
