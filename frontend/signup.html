<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockSense — Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Lucide Icons via CDN -->
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-icon"><i data-lucide="package"></i></div>
      <h1>Create your account</h1>
      <p>Get started with StockSense inventory management</p>
    </div>

    <div id="auth-alert" class="alert hidden"></div>

    <form id="signup-form" novalidate>
      <div class="form-group full mb-2">
        <label for="email">Work Email *</label>
        <input type="email" id="email" placeholder="name@company.com" required autocomplete="email" />
        <span class="field-error" id="email-err"></span>
      </div>

      <div class="form-group full mb-2">
        <label for="password">Password * (min 6 characters)</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="new-password" minlength="6" />
        <span class="field-error" id="password-err"></span>
      </div>

      <div class="form-group full mb-2">
        <label for="confirm-password">Confirm Password *</label>
        <input type="password" id="confirm-password" placeholder="••••••••" required autocomplete="new-password" />
        <span class="field-error" id="confirm-err"></span>
      </div>

      <button type="submit" class="btn btn-primary w-full mt-2" id="submit-btn">
        <i data-lucide="user-plus"></i>
        <span>Create Account</span>
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign in here</a>
    </div>
  </div>

  <div id="toast"></div>

<script type="module">
  import { api } from "./api.js";
  import { showAlert, hideAlert, setLoading, showToast, validateRequired, renderLucide } from "./utils.js";

  renderLucide();

  // If already authenticated, redirect to dashboard
  if (localStorage.getItem("stocksense_token")) {
    window.location.href = "index.html";
  }

  const form        = document.getElementById("signup-form");
  const emailEl     = document.getElementById("email");
  const passEl      = document.getElementById("password");
  const confirmEl   = document.getElementById("confirm-password");
  const alertEl     = document.getElementById("auth-alert");
  const submitBtn   = document.getElementById("submit-btn");

  form.addEventListener("submit", async e => {
    e.preventDefault();
    hideAlert(alertEl);

    const ok1 = validateRequired(emailEl, document.getElementById("email-err"));
    const ok2 = validateRequired(passEl,  document.getElementById("password-err"));
    const ok3 = validateRequired(confirmEl, document.getElementById("confirm-err"));
    if (!ok1 || !ok2 || !ok3) return;

    if (passEl.value.length < 6) {
      showAlert(alertEl, "Password must be at least 6 characters long.", "warn");
      return;
    }

    if (passEl.value !== confirmEl.value) {
      showAlert(alertEl, "Passwords do not match.", "error");
      return;
    }

    setLoading(submitBtn, true);
    try {
      const res = await api.signup({
        email: emailEl.value.trim(),
        password: passEl.value
      });

      localStorage.setItem("stocksense_token", res.token);
      localStorage.setItem("stocksense_email", res.email);

      showToast("Account created successfully! Redirecting…", "success");
      setTimeout(() => {
        window.location.href = "index.html";
      }, 500);
    } catch (err) {
      showAlert(alertEl, err.message, "error");
    } finally {
      setLoading(submitBtn, false);
      renderLucide();
    }
  });
</script>
</body>
</html>
