<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>StockSense — My Profile</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="style.css"/></head>
<body><div class="page-wrapper"><nav class="navbar"></nav><main class="content"><div class="page-header"><div class="header-icon"><i data-lucide="user-round"></i></div><div><h1>My Profile</h1><p>Your StockSense account details.</p></div></div><section class="card" style="max-width:680px"><div class="card-title"><i data-lucide="contact-round"></i><span>Account</span></div><div id="profile-content"><div class="empty-state"><div class="spinner"></div><p>Loading profile…</p></div></div></section></main><footer><p>StockSense · My Profile</p></footer><div id="toast"></div></div>
<script type="module">import{api}from'./api.js';import{requireAuth,markActiveNav,initNavToggle,initAuthHeader,renderLucide,showToast}from'./utils.js';if(!requireAuth())throw Error('Authentication required');markActiveNav();initNavToggle();initAuthHeader();renderLucide();const content=document.getElementById('profile-content');try{const user=await api.getCurrentUser();content.innerHTML=`<dl class="profile-details"><div><dt>Email</dt><dd>${String(user.email).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</dd></div><div><dt>Account ID</dt><dd>${user.id}</dd></div><div><dt>Member since</dt><dd>${new Date(user.created_at).toLocaleDateString()}</dd></div></dl>`}catch(e){content.innerHTML=`<div class="alert alert-error">${e.message}</div>`}renderLucide();</script></body></html>
