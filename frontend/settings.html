<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>StockSense — Warehouse Settings</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="style.css"/><script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script></head>
<body><div class="page-wrapper"><nav class="navbar"></nav><main class="content"><div class="page-header"><div class="header-icon"><i data-lucide="warehouse"></i></div><div><h1>Warehouse Settings</h1><p>Manage the locations used by your stock ledger.</p></div></div><div class="grid-2"><section class="card"><div class="card-title"><i data-lucide="map-pin-plus"></i><span>Add Location</span></div><div id="form-alert" class="alert hidden"></div><form id="location-form"><div class="form-group"><label for="location-name">Location name</label><input id="location-name" maxlength="120" placeholder="e.g. North Warehouse" required/></div><button class="btn btn-primary mt-2" type="submit"><i data-lucide="plus"></i> Add Location</button></form></section><section class="card"><div class="card-title"><i data-lucide="map-pinned"></i><span>Warehouse Locations</span></div><div id="locations-list"><div class="empty-state"><div class="spinner"></div><p>Loading locations…</p></div></div></section></div></main><footer><p>StockSense · Warehouse Settings</p></footer><div id="toast"></div></div>
<script type="module">import{api}from'./api.js';import{requireAuth,markActiveNav,initNavToggle,initAuthHeader,renderLucide,showToast,showAlert}from'./utils.js';if(!requireAuth())throw Error('Authentication required');markActiveNav();initNavToggle();initAuthHeader();renderLucide();const list=document.getElementById('locations-list'),form=document.getElementById('location-form'),alert=document.getElementById('form-alert');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const locations=await api.getLocations();list.innerHTML=locations.length?`<div class="table-wrapper"><table><thead><tr><th>Location</th><th>Actions</th></tr></thead><tbody>${locations.map(l=>`<tr><td>${esc(l.name)}</td><td><div class="flex flex-wrap" style="gap:.45rem"><button class="btn btn-outline" data-rename="${l.id}" data-name="${esc(l.name)}"><i data-lucide="pencil"></i> Rename</button><button class="btn btn-danger" data-delete="${l.id}" data-name="${esc(l.name)}"><i data-lucide="trash-2"></i> Delete</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state"><p>No locations yet. Add one to get started.</p></div>';list.querySelectorAll('[data-rename]').forEach(b=>b.addEventListener('click',async()=>{const name=prompt('Enter a new name for this location:',b.dataset.name);if(name===null)return;if(!name.trim())return showToast('Location name cannot be empty.','error');try{await api.renameLocation(b.dataset.rename,{name:name.trim()});showToast('Location renamed.','success');await load()}catch(e){showToast(e.message,'error')}}));list.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',async()=>{if(!confirm(`Delete location “${b.dataset.name}”?`))return;try{await api.deleteLocation(b.dataset.delete);showToast('Location deleted.','success');await load()}catch(e){showToast(e.message,'error')}}));renderLucide()}catch(e){list.innerHTML=`<div class="alert alert-error">${esc(e.message)}</div>`}}form.addEventListener('submit',async e=>{e.preventDefault();alert.classList.add('hidden');const input=document.getElementById('location-name');if(!input.value.trim())return showAlert(alert,'Enter a location name.','error');try{await api.createLocation({name:input.value.trim()});form.reset();showToast('Location added.','success');await load()}catch(e){showAlert(alert,e.message,'error')}});load();</script></body></html>
